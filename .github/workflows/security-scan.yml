name: Security Scan

on:
  push:
    branches: [main, claude/project-overview-setup-10olro]
  pull_request:
    branches: [main, claude/project-overview-setup-10olro]
  schedule:
    - cron: "0 0 * * 0" # Weekly security scan

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run npm audit
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm install --package-lock-only --no-audit --no-fund
            npm audit --audit-level high
          else
            echo "Frontend directory not found, skipping npm audit"
          fi
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run safety check
        run: |
          if [ -d "backend" ]; then
            cd backend
            pip install safety
            safety check -r requirements/base.txt --full-report
          else
            echo "Backend directory not found, skipping safety check"
          fi
        continue-on-error: true

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
        continue-on-error: true

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependency-scan, secret-scan]
    if: always()

    steps:
      - name: Generate security report
        run: |
          echo "Security Scan Summary"
          echo "====================="
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
