name: Backend CI

on:
  push:
    branches: [main, claude/project-overview-setup-10olro]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, claude/project-overview-setup-10olro]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements/base.txt
        continue-on-error: true

  test:
    name: Backend Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements/dev.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Create test environment
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/test_db" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "SECRET_KEY=test-secret-key-for-ci" >> .env
          echo "ENCRYPTION_KEY=test-encryption-key-for-ci" >> .env
          echo "R2_ACCOUNT_ID=test-account-id" >> .env
          echo "R2_ACCESS_KEY_ID=test-access-key-id" >> .env
          echo "R2_SECRET_ACCESS_KEY=test-secret-access-key" >> .env
          echo "R2_BUCKET_NAME=test-bucket" >> .env

      - name: Wait for Postgres
        run: |
          timeout 30s bash -c 'until pg_isready -h localhost -p 5432 -U test_user -d test_db; do sleep 1; done'

      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

      - name: Lint and type check
        run: |
          black --check app tests
          flake8 app tests
          mypy app || true
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-for-ci
          R2_ACCOUNT_ID: test-account-id
          R2_ACCESS_KEY_ID: test-access-key-id
          R2_SECRET_ACCESS_KEY: test-secret-access-key
          R2_BUCKET_NAME: test-bucket

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: test-secret-key-for-ci
          ENCRYPTION_KEY: test-encryption-key-for-ci
          R2_ACCOUNT_ID: test-account-id
          R2_ACCESS_KEY_ID: test-access-key-id
          R2_SECRET_ACCESS_KEY: test-secret-access-key
          R2_BUCKET_NAME: test-bucket

  build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: backend:${{ github.sha }}
