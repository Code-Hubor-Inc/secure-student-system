services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: secure_student
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d secure_student"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Secure Student System"
      DEBUG: "true"
      API_V1_STR: /api/v1
      DATABASE_URL: postgresql://user:password@postgres:5432/secure_student
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      ENCRYPTION_KEY: dev-encryption-key
      UPLOAD_DIR: ./storage/uploads
      MAX_FILE_SIZE: "104857600"
      ALLOWED_ORIGINS: http://localhost:3000
      R2_ACCOUNT_ID: dev-account-id
      R2_ACCESS_KEY_ID: dev-access-key-id
      R2_SECRET_ACCESS_KEY: dev-secret-access-key
      R2_BUCKET_NAME: dev-bucket
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
