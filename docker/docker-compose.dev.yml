# Local development overrides. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    environment:
      DEBUG: "true"
    volumes:
      - ../backend:/app

  frontend:
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ../frontend:/app
      - /app/node_modules
